<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>LABEED Admin</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B0B0D; color: #F1D98A; font-family: system-ui, sans-serif; }
    main { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; text-align: center; padding: 0 16px; }
    a { color: #D4AF37; }
  </style>
</head>
<body>
  <main>
    <div id="msg">Opening the admin console…</div>
    <div id="alt"></div>
  </main>
  <script>
    // The admin console runs on the owner's computer behind a tunnel whose address can change.
    // Its current address is published to this config file; this page always forwards there.
    var CONFIG = 'https://gist.githubusercontent.com/kakakhanbtk421-collab/0273ef1d3809fd37347c3cc8c87f1ef9/raw/labeed-server.json';
    fetch(CONFIG + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (c) {
        if (c.adminUrl && /^https:\/\//.test(c.adminUrl)) { location.replace(c.adminUrl.replace(/\/+$/, '') + '/admin'); return; }
        throw new Error('no address');
      })
      .catch(function () {
        document.getElementById('msg').textContent = 'The admin console is not reachable right now.';
        document.getElementById('alt').textContent = 'Check that the server computer is switched on and online, then try again.';
      });
  </script>
</body>
</html>
